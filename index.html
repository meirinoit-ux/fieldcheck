// ── Drive ──
async function loadFromDrive() {
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:8000,
        mcp_servers:[{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"gdrive"}],
        messages:[{role:"user",content:`Search Google Drive for file "${FILENAME}". If found return ONLY its text content. If not found return NOT_FOUND.`}]
      })
    });
    const d = await r.json();
    const txt = d.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"";
    if(txt.includes("NOT_FOUND"))return null;
    const m = txt.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : null;
  } catch{return null;}
}
async function saveToDrive(data) {
  try {
    await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:500,
        mcp_servers:[{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"gdrive"}],
        messages:[{role:"user",content:`In Google Drive find or create "${FILENAME}" and set its content to: ${JSON.stringify(data)}`}]
      })
    });
    return true;
  } catch{return false;}
}

// ── Email report builder ──
function statusLabel(v){ return v===null||v===undefined?"לא נבדק":v; }
function worksLabel(v){ return v==="works"?"✓ עובד":v==="broken"?"✗ לא עובד":v==="na"?"לא קיים":"לא נבדק"; }

function buildEmailBody(visit){
  const cl=visit.checklist||{};
  const fmtD=d=>new Date(d).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});
  const fmtT=d=>new Date(d).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});

  const lines=[];
  lines.push(`דוח ביקור אתר`);
  lines.push(`=====================================`);
  lines.push(`תאריך: ${fmtD(visit.createdAt)}  שעה: ${fmtT(visit.createdAt)}`);
  lines.push(`קבלן: ${visit.contractorName||"לא צוין"}`);
  lines.push(`מבצע הביקור: ${visit.inspector||"לא צוין"}`);
  lines.push(`את מי פגשנו: ${visit.metWith||"לא צוין"}`);
  lines.push(`סטטוס: ${visit.status||"לא הוגדר"}`);
  if(visit.siteName) lines.push(`תיאור: ${visit.siteName}`);

  lines.push(``);
  lines.push(`בדיקות שטח`);
  lines.push(`-------------------------------------`);
  lines.push(`משקל משאיות: ${cl.truckScale?.status==="works"?"✓ עובד":cl.truckScale?.status==="broken"?"✗ לא עובד":"לא נבדק"}`);
  lines.push(`פסולת אריזות לא מדווחת: ${cl.unregWaste?.found===true?"אותרה":cl.unregWaste?.found===false?"לא אותרה":"לא נבדק"}${cl.unregWaste?.note?` — ${cl.unregWaste.note}`:""}`);
  lines.push(`מכבש: ${worksLabel(cl.compactor?.works)}${cl.compactor?.count?`, כמות: ${cl.compactor.count}`:""}${cl.compactor?.note?` — ${cl.compactor.note}`:""}`);
  lines.push(`מגרסה: ${worksLabel(cl.crusher?.works)}${cl.crusher?.count?`, כמות: ${cl.crusher.count}`:""}${cl.crusher?.note?` — ${cl.crusher.note}`:""}`);
  lines.push(`קו שטיפה: ${worksLabel(cl.washLine?.works)}${cl.washLine?.count?`, כמות: ${cl.washLine.count}`:""}${cl.washLine?.note?` — ${cl.washLine.note}`:""}`);
  lines.push(`עובדי מיון בשטח: ${cl.sorters?.count||"לא צוין"}`);

  if(visit.tasks?.length){
    lines.push(``);
    lines.push(`משימות`);
    lines.push(`-------------------------------------`);
    visit.tasks.forEach(t=>lines.push(`${t.done?"[✓]":"[ ]"} ${t.text}`));
  }

  if(visit.truckWeights?.length){
    lines.push(``);
    lines.push(`שקילות משאיות`);
    lines.push(`-------------------------------------`);
    visit.truckWeights.forEach((w,i)=>lines.push(`משאית #${i+1}: ${w.weight} טון  (${fmtT(w.time)})`));
    const total=visit.truckWeights.reduce((s,w)=>s+parseFloat(w.weight||0),0).toFixed(1);
    lines.push(`סה"כ: ${total} טון (${visit.truckWeights.length} משאיות)`);
  }

  if(visit.note){
    lines.push(``);
    lines.push(`הערות`);
    lines.push(`-------------------------------------`);
    lines.push(visit.note);
  }

  if(visit.photos?.length){
    lines.push(``);
    lines.push(`תמונות`);
    lines.push(`-------------------------------------`);
    lines.push(`לביקור זה צורפו ${visit.photos.length} תמונות.`);
    lines.push(`(התמונות מצורפות כקבצים נפרדים — ראי מטה)`);
  }

  lines.push(``);
  lines.push(`=====================================`);
  lines.push(`נשלח מאפליקציית FieldCheck`);

  return lines.join("\n");
}

function sendEmail(visit){
  const fmtD=d=>new Date(d).toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit",year:"numeric"});
  const subject=encodeURIComponent(`דוח ביקור: ${visit.contractorName||visit.siteName||"אתר"} — ${fmtD(visit.createdAt)}`);
  const body=encodeURIComponent(buildEmailBody(visit));
  window.location.href=`mailto:?subject=${subject}&body=${body}`;

  // Download photos as zip-like trigger: open each photo in new tab for saving
  if(visit.photos?.length){
    setTimeout(()=>{
      visit.photos.forEach((ph,i)=>{
        const a=document.createElement("a");
        a.href=ph.src;
        a.download=`תמונה_${i+1}_${visit.contractorName||"ביקור"}.jpg`;
        a.click();
      });
    }, 800);
  }
}

// ── ContractorPicker ──
function ContractorPicker({value, onChange, contractors, onAddContractor}){
  const [showAdd, setShowAdd] = useState(false);
  const [newName, setNewName] = useState("");
  const [search, setSearch] = useState("");

  const list = contractors.filter(c => !c.startsWith("—"));
  const filtered = search.trim()
    ? list.filter(c => c.includes(search))
    : list;

  const handleAdd = () => {
    const name = newName.trim();
    if (!name) return;
    onAddContractor(name);
    onChange(name);
    setNewName("");
    setSearch("");
    setShowAdd(false);
  };

  return (
    <div>
      {/* Search + current value */}
      <div style={{position:"relative"}}>
        <input
          value={search || value}
          onChange={e => { setSearch(e.target.value); if(e.target.value==="") onChange(""); }}
          placeholder="חפש או בחר קבלן..."
          style={{...iS(), paddingLeft:36}}
          dir="rtl"
        />
        {(search || value) && (
          <button onClick={()=>{setSearch("");onChange("");}} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:C.textMuted}}>
            <Ic n="x" s={15}/>
          </button>
        )}
      </div>

      {/* Dropdown list when searching */}
      {search.trim() && (
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,marginTop:4,maxHeight:200,overflowY:"auto",boxShadow:"0 4px 16px rgba(0,0,0,0.12)",zIndex:20,position:"relative"}}>
          {filtered.length===0 ? (
            <div style={{padding:"10px 14px",fontSize:13,color:C.textMuted}}>לא נמצא קבלן — ניתן להוסיף חדש למטה</div>
          ) : filtered.map(c=>(
            <button key={c} onClick={()=>{onChange(c);setSearch("");}}
              style={{width:"100%",textAlign:"right",padding:"10px 14px",fontSize:14,color:c===value?C.green:C.textPrimary,
                background:c===value?C.green+"11":"transparent",borderBottom:`1px solid ${C.border}`,display:"block",direction:"rtl"}}>
              {c===value && <span style={{marginLeft:6,color:C.green}}>✓</span>}
              {c}
            </button>
          ))}
        </div>
      )}

      {/* Add new contractor */}
      {!showAdd ? (
        <button onClick={()=>setShowAdd(true)}
          style={{marginTop:8,display:"flex",alignItems:"center",gap:6,fontSize:13,color:C.accent,fontWeight:600}}>
          <Ic n="plus" s={14} c={C.accent}/> הוסף קבלן חדש לרשימה
        </button>
      ) : (
        <div style={{background:C.green+"0d",border:`1px solid ${C.green}44`,borderRadius:10,padding:12,marginTop:8}}>
          <div style={{fontSize:12,color:C.green,fontWeight:600,marginBottom:8}}>קבלן חדש — יישמר ברשימה לתמיד</div>
          <div style={{display:"flex",gap:8}}>
            <input
              value={newName}
              onChange={e=>setNewName(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleAdd()}
              placeholder="שם הקבלן..."
              style={{...iS({flex:1})}}
              dir="rtl"
              autoFocus
            />
            <button onClick={handleAdd} style={{background:C.green,color:"#fff",borderRadius:8,padding:"8px 12px",fontWeight:600,fontSize:13}}>הוסף</button>
            <button onClick={()=>{setShowAdd(false);setNewName("");}} style={{color:C.textMuted,padding:"8px 6px"}}><Ic n="x" s={16}/></button>
          </div>
        </div>
      )}
    </div>
  );
}

                    <div style={{display:"flex",alignItems:"center",gap:12}}>
                      <div style={{background:C.blue+"22",color:C.blue,borderRadius:8,padding:"4px 10px",fontFamily:"'IBM Plex Mono',monospace",fontSize:13,fontWeight:600}}>#{i+1}</div>
                      <div>
                        <div style={{fontSize:18,fontWeight:700,color:C.textPrimary}}>{w.weight} <span style={{fontSize:13,color:C.textMuted}}>טון</span></div>
                        <div style={{fontSize:11,color:C.textMuted}}>{fmtTime(w.time)}</div>
                      </div>
                    </div>
                    <button onClick={()=>up({truckWeights:visit.truckWeights.filter(x=>x.id!==w.id)})} style={{color:C.textMuted}}><Ic n="trash" s={16}/></button>
                  </div>
                ))}
                <div style={{background:C.accent+"11",border:`1px solid ${C.accent}33`,borderRadius:12,padding:"12px 16px",marginTop:8}}>
                  <div style={{fontSize:12,color:C.textMuted}}>סה״כ</div>
                  <div style={{fontSize:22,fontWeight:800,fontFamily:"'Syne',sans-serif",color:C.accent}}>
                    {(visit.truckWeights||[]).reduce((s,w)=>s+parseFloat(w.weight||0),0).toFixed(1)} <span style={{fontSize:14}}>טון</span>
                  </div>
                  <div style={{fontSize:12,color:C.textMuted}}>{visit.truckWeights.length} משאיות</div>
                </div>
              </>
            )}
          </div>
        )}

        {/* NOTE */}
        {tab==="note"&&(
          <textarea value={visit.note||""} onChange={e=>up({note:e.target.value})}
            placeholder="הערות חופשיות..." dir="rtl"
            style={{width:"100%",minHeight:240,background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"14px 16px",color:C.textPrimary,fontSize:14,lineHeight:1.6,resize:"vertical"}}/>
        )}
      </div>

      {/* share by email */}
      <div style={{padding:"0 16px 8px"}}>
        <Btn full v="success" icon="mail" onClick={()=>sendEmail(visit)}>שלח דוח ביקור במייל</Btn>
      </div>

      {/* delete */}
      <div style={{padding:"0 16px 20px",marginTop:4}}>
        {!del?<Btn full v="danger" icon="trash" onClick={()=>setDel(true)}>מחק ביקור</Btn>:(
          <div style={{background:C.red+"11",border:`1px solid ${C.red}44`,borderRadius:12,padding:16}}>
            <div style={{fontSize:14,color:C.textSecondary,marginBottom:12,textAlign:"center"}}>בטוחה שברצונך למחוק?</div>
            <div style={{display:"flex",gap:10}}>
              <Btn full v="danger" onClick={onDelete}>מחק</Btn>
              <Btn full v="ghost" onClick={()=>setDel(false)}>ביטול</Btn>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function WeightRow({onAdd}){
  const [v,setV]=useState("");
  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:14,marginBottom:14}}>
      <Lbl>הוסף שקילה</Lbl>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <input type="number" value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&v){onAdd(v);setV("");}}}
          placeholder="משקל בטון" step="0.1" min="0"
          style={{flex:1,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"10px 14px",color:C.textPrimary,fontSize:16}} dir="ltr"/>
        <span style={{color:C.textMuted,fontSize:13}}>טון</span>
        <button onClick={()=>{if(v){onAdd(v);setV("");}}} style={{background:C.accent,color:"#fff",borderRadius:10,padding:"10px 14px"}}><Ic n="plus" s={18}/></button>
      </div>
    </div>
  );
}

// ── App root ──
function App(){
  const [screen,setScreen]=useState("pick");
  const [user,setUser]=useState(null);
  const [users,setUsers]=useState(DEFAULT_USERS);
  const [contractors,setContractors]=useState(DEFAULT_CONTRACTORS);
  const [visits,setVisits]=useState([]);
  const [current,setCurrent]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    const s=localStorage.getItem("si-v3");
    if(s){try{const d=JSON.parse(s);if(d.visits)setVisits(d.visits);if(d.users)setUsers(d.users);if(d.contractors)setContractors(d.contractors);}catch{}}
    setLoading(false);
    loadFromDrive().then(d=>{
      if(d){
        if(d.visits)setVisits(v=>d.visits.length>=v.length?d.visits:v);
        if(d.users)setUsers(d.users);
        if(d.contractors)setContractors(d.contractors);
      }
    }).catch(()=>{});
  },[]);

  const persist=(v,u,c)=>{
    const p={visits:v||visits,users:u||users,contractors:c||contractors,savedAt:ts()};
    localStorage.setItem("si-v3",JSON.stringify(p));
    setSaving(true);
    saveToDrive(p).then(()=>setSaving(false));
  };

  const addContractor = (name) => {
    if (contractors.includes(name)) return;
    const next = [...contractors, name].sort((a,b) => {
      if(a.startsWith("—")) return -1;
      if(b.startsWith("—")) return 1;
      return a.localeCompare(b, "he");
    });
    setContractors(next);
    persist(null, null, next);
  };const n=visits.map(v=>v.id===updated.id?updated:v);setVisits(n);persist(n,null,null);};
  const delVisit=id=>{const n=visits.filter(v=>v.id!==id);setVisits(n);setCurrent(null);setScreen("list");persist(n,null,null);};
  const newVisit=()=>{
    const v={id:uid(),siteName:"",contractorName:"",createdAt:ts(),inspector:user,tasks:[],photos:[],note:"",status:"",truckWeights:[],metWith:"",checklist:makeChecklist()};
    const n=[v,...visits];setVisits(n);setCurrent(v.id);setScreen("detail");persist(n,null,null);
  };
  const saveUsers=u=>{setUsers(u);persist(null,u,null);setScreen("pick");};

  if(loading)return(<div style={{minHeight:"100dvh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}><style>{GS}</style><div className="sp"><Ic n="cloud" s={32} c={C.accent}/></div><div style={{color:C.textMuted,fontSize:14}}>טוען נתונים...</div></div>);

  return(
    <>
      <style>{GS}</style>
      {screen==="pick"&&<UserPicker users={users} onSelect={u=>{setUser(u);setScreen("list");}} onManage={()=>setScreen("manage")}/>}
      {screen==="manage"&&<ManageUsers users={users} onSave={saveUsers} onBack={()=>setScreen("pick")}/>}
      {screen==="list"&&<VisitList visits={visits} currentUser={user} onOpen={id=>{setCurrent(id);setScreen("detail");}} onNew={newVisit} onSwitch={()=>setScreen("pick")} saving={saving}/>}
      {screen==="detail"&&current&&(()=>{
        const v=visits.find(x=>x.id===current);
        if(!v){setScreen("list");return null;}
        return <VisitDetail visit={v} onChange={upVisit} onBack={()=>setScreen("list")} onDelete={()=>delVisit(current)} contractors={contractors} onAddContractor={addContractor}/>;
      })()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
